name: CI

on:
  pull_request:
  push:
    branches: [main]

# The data-v1 release that holds the databases is a draft, and reading a draft needs write access.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    # macOS: the build compiles the native Liquid Glass bridge. Repo is public, so these minutes are free.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Bible/lexicon databases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-v1 --dir data --pattern "*.db" --clobber

      # Gitignored and never needed by these checks, so an empty key is enough to compile.
      - name: Create YouTube API key stub
        run: echo "export const YOUTUBE_API_KEY = ''" > electron/youtube-key.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build desktop
        run: npm run build

      - name: Launch the app
        run: |
          npm run rebuild
          npm run smoke:electron

      - name: Build iPhone web bundle
        run: npm run ios:build:web

  native:
    name: Native Swift (BereanKit conformance, Mac + iOS Simulator builds)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The native Mac app targets macOS 27 (DECISIONS OD-2 / ADR-0007) and needs Xcode 27's SDK. GitHub's
      # hosted images top out at Xcode 26.6 today, so the Mac build runs here only when Xcode 27 exists;
      # otherwise it is a required local check before merge (scripts/native/build.sh mac). BereanKit and the
      # iOS app (iOS 18 floor) build with the newest Xcode available.
      - name: Select newest Xcode
        id: xcode
        shell: bash
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version && swift --version
          if [[ "$(basename "$XC")" == Xcode_27* || "$(basename "$XC")" == Xcode_2[89]* ]]; then echo "mac=yes" >> "$GITHUB_OUTPUT"; else echo "mac=no" >> "$GITHUB_OUTPUT"; echo "::notice::No Xcode 27 on this image — BereanMac (macOS 27) build skipped in CI; verified locally before merge."; fi

      # The Bible-service conformance tests read the bundled text databases (read-only).
      - name: Download Bible/lexicon databases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download data-v1 --dir data --pattern "*.db" --clobber

      # Golden fixtures are committed; the TypeScript drift guard runs in the check job.
      - name: BereanKit conformance tests
        run: npm run native:test

      - name: Build BereanMac
        if: steps.xcode.outputs.mac == 'yes'
        run: npm run native:build:mac

      - name: Build BereanIOS (Simulator)
        run: npm run native:build:ios
