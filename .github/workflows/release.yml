name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Bible/lexicon databases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-v1 --dir data --pattern "*.db" --clobber

      - name: Convert databases to DELETE journal mode
        run: node scripts/convert-dbs.js

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Create YouTube API key file
        shell: bash
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: echo "export const YOUTUBE_API_KEY = '${YT_KEY}'" > electron/youtube-key.ts

      - name: Build renderer + main
        run: npm run build

      # Build our OWN signing keychain and import the cert into it, instead of letting
      # electron-builder create + unlock a throwaway temp keychain per run. That built-in
      # path (`security set-key-partition-list` on a just-created keychain) breaks whenever
      # GitHub rolls the macos-latest runner image — it failed hard on image 20260831 with
      # "SecKeychainUnlock: The user name or passphrase you entered is not correct" after
      # succeeding on 20260728 an hour earlier, with no secret change. Doing the keychain
      # setup explicitly here (a widely-used, stable recipe) takes that moving part out of
      # electron-builder's hands; it just consumes the ready keychain via $CSC_KEYCHAIN.
      - name: Set up signing keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/berean-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/berean-cert.p12"

          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          # Don't auto-lock mid-build (6h timeout, and -l disables idle lock).
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$MAC_CERT_PASSWORD" \
            -k "$KEYCHAIN_PATH" -f pkcs12 -t cert \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild

          # Allow codesign to use the private key without an interactive prompt. Include
          # codesign: in the partition list (electron-builder's own call omits it).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null

          # Make it visible to the toolchain: prepend to the user search list (keep login),
          # and set as default so bare `security` calls target it too.
          security list-keychains -d user -s "$KEYCHAIN_PATH" "login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Package macOS DMG (sign + notarize)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cert is already imported into $CSC_KEYCHAIN (set above) — no CSC_LINK, so
          # electron-builder uses that keychain's identity directly and never touches its
          # own temp-keychain create/unlock path.
          # Apple notarization credentials (app-specific password from appleid.apple.com)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Retry only guards Apple-side notarization flakiness now (upload timeouts / 5xx from
        # notarytool) — signing itself is deterministic with the pre-built keychain above.
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder --mac dmg zip --config.mac.notarize.teamId="${APPLE_TEAM_ID}" --publish always; then
              exit 0
            fi
            echo "electron-builder attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then
              echo "retrying after a short delay (notarization is the usual culprit)…"
              sleep 30
            fi
          done
          echo "electron-builder failed 3 times — giving up"
          exit 1

      - name: Tear down signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/berean-signing.keychain-db" 2>/dev/null || true

  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Bible/lexicon databases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-v1 --dir data --pattern "*.db" --clobber

      - name: Convert databases to DELETE journal mode
        run: node scripts/convert-dbs.js

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Create YouTube API key file
        shell: bash
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: echo "export const YOUTUBE_API_KEY = '${YT_KEY}'" > electron/youtube-key.ts

      - name: Generate Windows icon (fallback if icon.ico is missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/icon.ico")) {
            Write-Host "icon.ico not found, generating from icon.png..."
            Add-Type -AssemblyName System.Drawing
            $img = [System.Drawing.Image]::FromFile((Resolve-Path "assets/icon.png").Path)
            $ico = [System.Drawing.Icon]::FromHandle($img.GetHicon())
            $fs = [System.IO.File]::OpenWrite("assets/icon.ico")
            $ico.Save($fs)
            $fs.Close()
            $ico.Dispose()
            $img.Dispose()
            Write-Host "icon.ico generated"
          } else {
            Write-Host "icon.ico already present"
          }

      - name: Build renderer + main
        run: npm run build

      - name: Package Windows NSIS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — set these secrets if you have a Windows cert
          # WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          npx electron-builder --win nsis --publish always

  mark-prerelease:
    name: Mark pre-release if beta tag
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc')
    steps:
      - name: Find and mark release as pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -n "$RELEASE_ID" ]; then
            gh api repos/${{ github.repository }}/releases/$RELEASE_ID \
              --method PATCH \
              --field prerelease=true \
              --field draft=false
            echo "Marked release $RELEASE_ID as pre-release"
          else
            echo "No release found for tag $TAG — skipping"
          fi

  publish-stable:
    name: Publish stable release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-rc')"
    steps:
      - name: Publish draft as stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -n "$RELEASE_ID" ]; then
            gh api repos/${{ github.repository }}/releases/$RELEASE_ID \
              --method PATCH \
              --field prerelease=false \
              --field draft=false
            echo "Published release $RELEASE_ID as stable"
          else
            echo "No release found for tag $TAG — skipping"
          fi
