name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Bible/lexicon databases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-v1 --dir data --pattern "*.db" --clobber

      - name: Convert databases to DELETE journal mode
        run: node scripts/convert-dbs.js

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Create YouTube API key file
        shell: bash
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: echo "export const YOUTUBE_API_KEY = '${YT_KEY}'" > electron/youtube-key.ts

      - name: Build renderer + main
        run: npm run build

      - name: Package macOS DMG (sign + notarize)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application certificate (base64-encoded .p12 + password)
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Apple notarization credentials (app-specific password from appleid.apple.com)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-builder --mac dmg zip --config.mac.notarize=true --publish always

  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Bible/lexicon databases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download data-v1 --dir data --pattern "*.db" --clobber

      - name: Convert databases to DELETE journal mode
        run: node scripts/convert-dbs.js

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Create YouTube API key file
        shell: bash
        env:
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: echo "export const YOUTUBE_API_KEY = '${YT_KEY}'" > electron/youtube-key.ts

      - name: Generate Windows icon (fallback if icon.ico is missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/icon.ico")) {
            Write-Host "icon.ico not found, generating from icon.png..."
            Add-Type -AssemblyName System.Drawing
            $img = [System.Drawing.Image]::FromFile((Resolve-Path "assets/icon.png").Path)
            $ico = [System.Drawing.Icon]::FromHandle($img.GetHicon())
            $fs = [System.IO.File]::OpenWrite("assets/icon.ico")
            $ico.Save($fs)
            $fs.Close()
            $ico.Dispose()
            $img.Dispose()
            Write-Host "icon.ico generated"
          } else {
            Write-Host "icon.ico already present"
          }

      - name: Build renderer + main
        run: npm run build

      - name: Package Windows NSIS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing — set these secrets if you have a Windows cert
          # WIN_CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          npx electron-builder --win nsis --publish always

  mark-prerelease:
    name: Mark pre-release if beta tag
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc')
    steps:
      - name: Find and mark release as pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -n "$RELEASE_ID" ]; then
            gh api repos/${{ github.repository }}/releases/$RELEASE_ID \
              --method PATCH \
              --field prerelease=true \
              --field draft=false
            echo "Marked release $RELEASE_ID as pre-release"
          else
            echo "No release found for tag $TAG — skipping"
          fi

  publish-stable:
    name: Publish stable release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-rc')"
    steps:
      - name: Publish draft as stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -n "$RELEASE_ID" ]; then
            gh api repos/${{ github.repository }}/releases/$RELEASE_ID \
              --method PATCH \
              --field prerelease=false \
              --field draft=false
            echo "Published release $RELEASE_ID as stable"
          else
            echo "No release found for tag $TAG — skipping"
          fi
